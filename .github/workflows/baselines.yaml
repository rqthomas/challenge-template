# Trigger for the engine's baseline-forecasts workflow. Copy into .github/workflows/ of a
# challenge repository; set the schedule, and the engine version after @.
# pipeline.yaml runs the `daily` baselines every day and the `weekly` ones on Sunday; run either by hand here.
name: baseline-forecasts

on:
  # No schedule here: pipeline.yaml runs this stage, in order with the others.
  # This trigger is for manual and dry runs.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: read real data, write nothing (output kept as an artifact)'
        type: boolean
        default: false
      schedule:
        description: Which baselines to run
        type: choice
        options: [daily, weekly]
        default: daily

concurrency:
  group: baselines-${{ github.event.schedule || inputs.schedule }}
  cancel-in-progress: false

jobs:
  run:
    uses: rqthomas/challenge-ci/.github/workflows/_baselines.yaml@v0.1.0-rc.14
    with:
      dry_run: ${{ inputs.dry_run || false }}
      schedule: ${{ (github.event.schedule == '0 1 * * SUN' || inputs.schedule == 'weekly') && 'weekly' || 'daily' }}
    secrets: inherit
