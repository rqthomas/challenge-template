# Trigger for the engine's scoring workflow. Copy into .github/workflows/ of a
# challenge repository; set the schedule, and the engine version after @.
name: scoring

on:
  # No schedule here: pipeline.yaml runs this stage, in order with the others.
  # This trigger is for manual and dry runs.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: read real data, write nothing (output kept as an artifact)'
        type: boolean
        default: false
      since:
        description: Score forecasts after this date (YYYY-MM-DD); empty for six months ago
        type: string
        default: ''

concurrency:
  group: scoring
  cancel-in-progress: false

jobs:
  run:
    uses: rqthomas/challenge-ci/.github/workflows/_scoring.yaml@v0.1.0-rc.14
    with:
      dry_run: ${{ inputs.dry_run || false }}
      since: ${{ inputs.since || '' }}
    secrets: inherit
