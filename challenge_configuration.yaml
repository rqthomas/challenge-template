# Configuration of an example forecasting challenge. Every key is described in
# the engine's docs/configuration.md (eco4cast/challenge-ci).
#
# As shipped, this file points at the Ecological Forecasting Initiative's
# public store under its own project_id, `templatecast`, so every stage can be
# dry-run (DRY_RUN=true) before you have storage of your own. Replace every
# value marked CHANGE before running anything for real.

# IDENTITY -------------------------------------------------------------------
# CHANGE: a short id, used in every path and row the challenge writes.
project_id: templatecast
challenge_long_name: Example Forecasting Challenge
# CHANGE: this repository, and where its dashboard is published (GitHub Pages).
github_repo: rqthomas/challenge-template
challenge_url: https://projects.ecoforecast.org/challenge-template

# STORAGE --------------------------------------------------------------------
# CHANGE: your own S3 store. The forecasts, scores, summaries and targets
# buckets must allow anonymous reads.
endpoint: sdsc.osn.xsede.org
forecasts_bucket: bio230014-bucket01/test_generalization/challenges/forecasts
summaries_bucket: bio230014-bucket01/test_generalization/challenges/forecasts
scores_bucket: bio230014-bucket01/test_generalization/challenges/scores
targets_bucket: bio230014-bucket01/test_generalization/challenges/targets
model_metadata_bucket: bio230014-bucket01/test_generalization/challenges/metadata/model_id
# Record of submissions already processed (one file per challenge).
processed_submissions: bio230014-bucket01/test_generalization/metadata/processed_submissions_templatecast.csv
# Where participants upload forecasts.
submissions_endpoint: s3-west.nrp-nautilus.io
submissions_bucket: submissions
# Scratch space used while scoring; files under it are deleted every run.
scratch:
  endpoint: s3-west.nrp-nautilus.io
  bucket: efi-scores/tmp/templatecast
# Names of the environment variables (GitHub secrets) holding each store's
# keys. These are the defaults; never put the keys themselves here.
credentials:
  main: {key_env: OSN_KEY, secret_env: OSN_SECRET}
  submissions: {key_env: AWS_ACCESS_KEY_SUBMISSIONS, secret_env: AWS_SECRET_ACCESS_KEY_SUBMISSIONS}
  scratch: {key_env: EFI_NRP_KEY, secret_env: EFI_NRP_SECRET}

# SUBMISSIONS ----------------------------------------------------------------
submissions:
  # The EFI submissions bucket is shared, so only files named with this
  # challenge's themes (`lakes-...`) are touched. Keep this true for a shared
  # bucket; with a bucket of your own it can go.
  known_themes_only: true
  min_reference_date: '2026-01-01'

# SITES ----------------------------------------------------------------------
# One row per site; the `lakes` column marks the sites of the Lakes group.
sites:
  metadata_url: sites.csv
  columns: {site_id: site_id, site_name: site_name, latitude: latitude, longitude: longitude}

# REGISTRATION AND VARIABLES -------------------------------------------------
# The EFI registration form's responses; only rows naming this project_id are
# used. CHANGE to your own form's sheet, or keep EFI's and ask EFI to add your
# challenge to it.
model_metadata_gsheet: https://docs.google.com/spreadsheets/d/1f177dpaxLzc4UuQ4_SJV9JWIbQPlilVnEztyvZE6aSU/edit?usp=sharing
# One row per variable: long name, description, duration.
target_metadata_gsheet: https://docs.google.com/spreadsheets/d/10YTX9ae_C1rFdLgEDkUcCRCpUkVYv06leY01BtD1BgM/edit?usp=sharing
example_model_id: example

# TARGET GROUPS --------------------------------------------------------------
target_groups:
  Lakes:
    targets_script: challenge/targets/lakes_targets.R
    # CHANGE with project_id: the file the targets script writes.
    targets_file: "https://sdsc.osn.xsede.org/bio230014-bucket01/challenges/targets/project_id=templatecast/duration=P1D/lakes-targets.csv.gz"
    variable: [temperature]
    duration: [P1D]
    max_horizon: [30]
    # Participants' file names start with the theme: lakes-2026-01-01-mymodel.csv
    theme: lakes
    focal_sites: [BARC, CRAM]
    thumbnail_link: 'https://www.neonscience.org/sites/default/files/styles/_edit_list_additional_actions_max_width_300/public/image-content-images/06092015-BarcoBuoy-400.jpg'
    thumbnail_title: 'Lake buoy'
    baselines:
      - {model_id: climatology, method: climatology, schedule: daily}
      - {model_id: persistenceRW, method: persistence_rw, schedule: daily}
    group_vars:
      temperature: {duration: P1D, max_horizon: 30, var_doi: "None", var_citation: "None"}

# GITHUB ACTIONS -------------------------------------------------------------
ci:
  # The engine's base image of the release named in the trigger workflows is
  # used unless this is set (e.g. to an image built from challenge/Dockerfile).
  # docker_image: ghcr.io/<owner>/<repo>:latest
  # Runner for heavy jobs (scoring); a self-hosted runner's name, or:
  large_runner: ubuntu-latest
  # healthchecks.io ping URLs by job name; a job without one is not monitored.
  healthchecks: {}

# DASHBOARD ------------------------------------------------------------------
dashboard:
  title: 'Example Forecasting Challenge'
  contact_email: 'eco4cast.initiative@gmail.com'
  registration_form_url: 'https://forms.gle/kg2Vkpho9BoMXSy57'
  n_plot_sites: 2

# CATALOG --------------------------------------------------------------------
catalog_config:
  # CHANGE: an empty repository the catalog workflow commits to.
  catalog_repo: eco4cast/challenge-template-catalog
  catalog_path: 'challenge-template-catalog'
  catalog_title: "Example Forecasting Challenge"
  about_string: 'https://projects.ecoforecast.org/challenge-template'
  about_title: 'Example Forecasting Challenge'
  documentation_url: 'https://projects.ecoforecast.org/challenge-template'
  host_url: "https://ecoforecast.org/"
  host_name: "Ecological Forecasting Initiative"
  citation_doi_link: "https://doi.org/10.1002/fee.2616"
  citation_doi: "10.1002/fee.2616"
  citation_text: "Thomas, R.Q., C. Boettiger, C.C. Carey, M.C. Dietze, L.R. Johnson, M.A. Kenney, J.S. Mclachlan, J.A. Peters, E.R. Sokol, J.F. Weltzin, A. Willson, W.M. Woelmer, and Challenge Contributors. 2023. The NEON Ecological Forecasting Challenge. Frontiers in Ecology and Environment 21: 112-113."
  forecast_path: 'challenge-template-catalog/forecasts'
  scores_path: 'challenge-template-catalog/scores'
  summaries_path: 'challenge-template-catalog/summaries'
  targets_path: 'challenge-template-catalog/targets/'
  site_path: 'challenge-template-catalog/sites'
  site_type: 'MultiPoint'
  bbox: {max_lat: 47, min_lat: 29, max_lon: -82, min_lon: -90}
