# Configuration of an example forecasting challenge. Every key is described in
# the engine's docs/configuration.md (eco4cast/challenge-ci).
#
# This challenge stores everything in the Backblaze B2 bucket `template-challenge`
# under the project_id `templatecast`. To start your own challenge from this
# file, replace every value marked CHANGE and the storage section.

# IDENTITY -------------------------------------------------------------------
# CHANGE: a short id, used in every path and row the challenge writes.
project_id: templatecast
challenge_long_name: Example Forecasting Challenge
# CHANGE: this repository, and where its dashboard is published (GitHub Pages).
github_repo: rqthomas/challenge-template
challenge_url: https://rqthomas.github.io/challenge-template/

# STORAGE --------------------------------------------------------------------
# Everything lives in one private Backblaze B2 bucket, `template-challenge`,
# through its S3-compatible API. The region (us-east-005) is read from the
# endpoint. README.md ("Set up a free Backblaze B2 private bucket") shows how to
# create your own bucket and the keys, and the `sed` command that changes the
# bucket name and endpoint in this file.
endpoint: s3.us-east-005.backblazeb2.com
# `false` (as here): the bucket is private. The engine reads it with the key, and
# participants read the targets, forecasts and scores with a read-only key you
# give them. `true`: the bucket is public and the engine reads it anonymously, as
# participants do; B2 does not answer anonymous list requests, so that suits
# single files better than folders of data (see the end of that README section).
public_read: false
forecasts_bucket: template-challenge/forecasts
summaries_bucket: template-challenge/forecasts
scores_bucket: template-challenge/scores
targets_bucket: template-challenge/targets
model_metadata_bucket: template-challenge/metadata/model_id
# Record of submissions already processed (one file per challenge).
processed_submissions: template-challenge/metadata/processed_submissions.csv
# Scratch space used while scoring; files under it are deleted every run.
scratch:
  endpoint: s3.us-east-005.backblazeb2.com
  bucket: template-challenge/tmp
# Names of the environment variables (GitHub secrets) holding each store's keys;
# never put the keys themselves here. The workflows pass the main store's key as
# S3_ACCESS_KEY_ID (the B2 application key ID) and S3_SECRET_ACCESS_KEY (the
# application key), which are the defaults. Scoring's scratch space is in the same
# bucket, so it uses the same key.
credentials:
  main: {key_env: S3_ACCESS_KEY_ID, secret_env: S3_SECRET_ACCESS_KEY}
  scratch: {key_env: S3_ACCESS_KEY_ID, secret_env: S3_SECRET_ACCESS_KEY}

# SUBMISSIONS ----------------------------------------------------------------
# Participants submit from their own public git repositories (GitHub, GitLab,
# Bitbucket, Codeberg or Hugging Face): the CI reads new forecast files from every repository
# listed in the registry. Nothing is uploaded, so there is no submissions bucket
# and no key to hand out. A repository describes its models in
# `challenge-model.yaml`; see "Submissions from git repositories" in the
# engine's docs/operations.md.
submissions:
  repos:
    # CSV of the repositories to read (`repo,location,registered`): a row per
    # repository, added by the registration bot (or by hand). `location` is
    # `repo` (forecasts are read from the repository) or `bucket`.
    registry: registry/forecast_repos.csv
    # Participants register by opening the issue form in
    # .github/ISSUE_TEMPLATE; a bot adds the repository to the registry.
    issue_registration: true
    # Hosts a participant's repository may be on (these are the defaults; add a
    # self-hosted server here).
    # allowed_hosts: [github.com, gitlab.com, bitbucket.org, codeberg.org, huggingface.co]
  # Do not read a submissions bucket. To also accept uploads to one, remove
  # this line and set `submissions_endpoint`, `submissions_bucket` and
  # `credentials: {submissions: ...}` (see the engine's docs/configuration.md).
  use_bucket: false
  # Write the baseline forecasts straight to the forecasts bucket.
  baselines_destination: forecasts_bucket
  min_reference_date: '2026-01-01'

# SITES ----------------------------------------------------------------------
# One row per site; the `lakes` column marks the sites of the Lakes group.
sites:
  metadata_url: sites.csv
  columns: {site_id: site_id, site_name: site_name, latitude: latitude, longitude: longitude}

# REGISTRATION AND VARIABLES -------------------------------------------------
# The EFI registration form's responses; only rows naming this project_id are
# used. CHANGE to your own form's sheet, or keep EFI's and ask EFI to add your
# challenge to it.
model_metadata_gsheet: https://docs.google.com/spreadsheets/d/1f177dpaxLzc4UuQ4_SJV9JWIbQPlilVnEztyvZE6aSU/edit?usp=sharing
# One row per variable: long name, description, duration.
target_metadata_gsheet: https://docs.google.com/spreadsheets/d/10YTX9ae_C1rFdLgEDkUcCRCpUkVYv06leY01BtD1BgM/edit?usp=sharing
example_model_id: example

# TARGET GROUPS --------------------------------------------------------------
target_groups:
  Lakes:
    targets_script: challenge/targets/lakes_targets.R
    # CHANGE with project_id: the file the targets script writes.
    targets_file: "https://s3.us-east-005.backblazeb2.com/template-challenge/targets/project_id=templatecast/duration=P1D/lakes-targets.csv.gz"
    variable: [temperature]
    duration: [P1D]
    max_horizon: [30]
    # Participants' file names start with the theme: lakes-2026-01-01-mymodel.csv
    theme: lakes
    focal_sites: [fcre, bvre]
    thumbnail_link: 'https://raw.githubusercontent.com/addelany/vera4cast/main/catalog/thumbnail_plots/fcr_catwalk.jpg'
    thumbnail_title: 'Falling Creek Reservoir catwalk (VERA)'
    baselines:
      - {model_id: climatology, method: climatology, schedule: daily}
      - {model_id: persistenceRW, method: persistence_rw, schedule: daily}
    group_vars:
      temperature: {duration: P1D, max_horizon: 30, var_doi: "None", var_citation: "None"}

# GITHUB ACTIONS -------------------------------------------------------------
ci:
  # The engine's base image of the release named in the trigger workflows is
  # used unless this is set (e.g. to an image built from challenge/Dockerfile).
  # docker_image: ghcr.io/<owner>/<repo>:latest
  # Runner for heavy jobs (scoring); a self-hosted runner's name, or:
  large_runner: ubuntu-latest
  # healthchecks.io ping URLs by job name; a job without one is not monitored.
  healthchecks: {}

# DASHBOARD ------------------------------------------------------------------
dashboard:
  title: 'Example Forecasting Challenge'
  contact_email: 'rqthomas@vt.edu'
  registration_form_url: 'https://forms.gle/kg2Vkpho9BoMXSy57'
  n_plot_sites: 2
  # The leaderboard's "Horizon" toggle: all horizons, or one of these lead times (days).
  horizons: [1, 7]
  # A working example submission, linked from the instructions.
  example_submission_repo: rqthomas/challenge-template-example-submission

# CATALOG --------------------------------------------------------------------
catalog_config:
  # The catalog workflow commits the catalog to the `catalog` branch of this
  # repository (catalog_repo defaults to github_repo), which its first run creates;
  # the built-in token pushes it, so there is no catalog repository and no
  # CATALOG_TOKEN. For a large catalog, give it a repository of its own instead:
  # set catalog_repo to it and leave out catalog_branch (see the engine's
  # docs/launching-a-new-challenge.md, "The catalog").
  catalog_branch: catalog
  # The folder the branch is cloned into, next to this repository (only on the
  # machine that runs the stage; its name does not matter, but keep it specific).
  catalog_path: 'challenge-template-catalog'
  catalog_title: "Example Forecasting Challenge"
  about_string: 'https://projects.ecoforecast.org/challenge-template'
  about_title: 'Example Forecasting Challenge'
  documentation_url: 'https://rqthomas.github.io/challenge-template/'
  host_url: "https://ecoforecast.org/"
  host_name: "Ecological Forecasting Initiative"
  # The water temperature targets are the Virginia Reservoirs LTREB's, from the VERA
  # Forecasting Challenge (https://www.ltreb-reservoirs.org/vera4cast/). CHANGE the
  # three citation keys for your own data.
  citation_doi_link: "https://doi.org/10.22541/essoar.15011733/v1"
  citation_doi: "10.22541/essoar.15011733/v1"
  citation_text: "Cayelan C. Carey, Adrienne Breef-Pilz, Austin D. Delany, et al. A real-time, automated ecological monitoring workflow and data publication program to enable daily ecosystem forecasting. ESS Open Archive. 05 November 2026. https://doi.org/10.22541/essoar.15011733/v1"
  forecast_path: 'challenge-template-catalog/forecasts'
  scores_path: 'challenge-template-catalog/scores'
  summaries_path: 'challenge-template-catalog/summaries'
  targets_path: 'challenge-template-catalog/targets/'
  site_path: 'challenge-template-catalog/sites'
  site_type: 'MultiPoint'
  # The catalog's spatial extent: the sites in sites.csv (the two Virginia reservoirs).
  bbox: {max_lat: 37.32, min_lat: 37.30, max_lon: -79.81, min_lon: -79.84}
